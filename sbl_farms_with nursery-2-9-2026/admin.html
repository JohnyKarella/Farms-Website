<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SBL Farms | Admin Login</title>
    <link rel="stylesheet" href="assets/admin/admin.css?v=16">
</head>
<body class="login-page">
    <div class="login-backdrop slide-bg" style="background-image:url('assets/customs/images/banner/main_banner/bnr (12).jpg');"></div>
    <main class="shell">
        <section class="login-view">
            <div class="brand-mark">
                <a href="index.html" class="topbar-logo" title="Back to SBL Farms">
                    <img src="assets/images/footerlogo.png" alt="SBL Farms Logo" class="admin-logo">
                    <span class="brand-text">SBL <span>FARMS</span></span>
                </a>
            </div>

            <div class="login-panel">
                <div class="login-header-row">
                    <div class="login-panel-logo">
                        <img src="assets/images/footerlogo.png" alt="SBL Farms Logo" class="panel-logo">
                    </div>
                    <div id="serverStatusBadge" class="server-status-badge checking" title="Checking server connection status">
                        <span class="status-dot"></span>
                        <span id="serverStatusText">Checking server...</span>
                    </div>
                </div>

                <!-- Warning shown only if opened via file:// protocol -->
                <div id="fileWarningBanner" class="file-warning-banner">
                    ⚠️ <strong>Local File Notice:</strong> Browsers block API requests from <code>file://</code> URLs.
                    <div style="margin-top: 5px;">
                        Please open: <a href="http://localhost:5000/admin.html">http://localhost:5000/admin.html</a>
                    </div>
                </div>

                <p class="eyebrow">Operations Desk</p>
                <h1>Admin login</h1>
                <p class="muted">Sign in to open the enquiry desk and manage leads.</p>

                <form id="loginForm" novalidate>
                    <label for="username">Admin username</label>
                    <div class="input-group">
                        <span class="input-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </span>
                        <input id="username" type="text" autocomplete="username" placeholder="e.g. admin" required autofocus>
                    </div>

                    <label for="password">Admin password</label>
                    <div class="input-group">
                        <span class="input-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
                    </div>

                    <div class="form-extra-row">
                        <label class="remember-label">
                            <input type="checkbox" id="rememberMe">
                            <span>Remember username</span>
                        </label>
                    </div>

                    <button type="submit" id="submitBtn">
                        <span id="btnText">Sign in to Dashboard &rarr;</span>
                    </button>

                    <div id="loginAlert" class="login-alert-box" role="alert">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                        <span id="loginAlertText"></span>
                    </div>
                </form>

                <div class="login-security-footer">
                    <a href="index.html" class="back-to-site">&larr; Return to SBL Farms Website</a>
                </div>
            </div>
        </section>
    </main>
    <script src="assets/admin/admin-login.js?v=16"></script>
</body>
</html>
